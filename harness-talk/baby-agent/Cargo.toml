[package]
name = "baby-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "One model, one file-reading tool, one agent loop"
publish = false
default-run = "baby-agent"

[[bin]]
name = "baby-agent"
path = "src/main.rs"

[[bin]]
name = "baby-agent-complete"
path = "src/complete.rs"

[workspace]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
