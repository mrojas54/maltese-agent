#    handler passes `ToolError::classify` to `map_err`, which maps
#    `TripwireTriggered` to `ToolError::Tripwire`; the router turns the handler
#    result into a response through `IntoCallToolResult::into_call_tool_result`,
#    which emits `TRIPWIRE_ERROR_CODE`; `call_tool` checks that code and revokes
#    the session.

