# Trailmark repository links for falcon-mcp (Trailmark 0.5+).
#
# Trailmark's Rust parser leaves these calls unresolved, so without this file
# every MCP tool handler looks unreachable from `main` and the taint pass stops
# at server startup. The parser misses:
#   - crate and module paths (`falcon_mcp::Sandbox::new`, `fs_basic::fs_read`);
#   - method calls on a value (`sandbox.resolve(..)`, `self.check_bin(..)`),
#     including ones split across lines;
#   - rmcp's macro-generated dispatch from `ServerHandler::call_tool` through
#     `tool_router.call(..)` to each `#[tool]` method;
#   - function paths passed as values (`.map_err(ToolError::classify)`) and
#     trait-method dispatch (`IntoCallToolResult::into_call_tool_result`).
#
# Every edge below is a real call in src/ except two kinds that model rmcp
# internals and carry confidence = "inferred": group 2 (the serve loop and
# router) and the last group 7 entry (the IntoCallToolResult trait dispatch).
# Keep the file in step with the code: a new `#[tool]` method needs a group 2
# and a group 3 entry,
# a new `sandbox.*` call needs a group 4 entry, and a new handler that maps
# errors through `ToolError::classify` needs a group 7 entry.


# 1. main -> library: crate-path calls (`falcon_mcp::...`) and calls on the
#    `server` / `Sandbox::new(..)?` values

[[link]]
source = "src.main:main"
target = "src.sandbox:Sandbox.new"
kind = "calls"
confidence = "certain"
description = "main -> Sandbox.new"

[[link]]
source = "src.main:main"
target = "src.sandbox:Sandbox.with_honeytokens"
kind = "calls"
confidence = "certain"
description = "main -> Sandbox.with_honeytokens"

[[link]]
