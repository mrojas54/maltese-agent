[workspace]
resolver = "2"
members = ["falcon-mcp", "falcon-agent"]
# The Women in Rust demos are rustlings-shaped sets of exercises that are
# broken on purpose, so each is its own package rather than a member: a member
# with intentional compile errors would fail every `cargo build --workspace`.
# CI checks each separately with `cargo run -- verify` in its directory. The
# runner they share is excluded for symmetry; the demos reach it by path.
exclude = ["women-in-rust/runner", "women-in-rust/demo00"]
