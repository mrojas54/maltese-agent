[package]
name = "demo-runner"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The rustlings-style runner shared by the Women in Rust demos"
publish = false

# Its own tiny workspace, like each demo. The root manifest also lists this
# directory under `exclude`; this table is what stops cargo from walking up
# the directory tree to look for a parent at all.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# process + io for the wire probe, time for its timeouts, rt to run it.
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "macros"] }
# The exercise list and hints come from each demo's info.toml.
toml = "0.9"
# The wire probe starts every server in a fresh scratch directory.
tempfile = "3"
