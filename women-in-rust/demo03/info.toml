# Exercise metadata for the shared runner (../runner), in the shape of
# rustlings' info.toml. Order matters: `cargo run -- next` walks this list top
# to bottom.
#
#   name                 the binary name (see Cargo.toml) and the file stem
#   dir                  the folder under exercises/ and solutions/
#   test                 run `cargo test --bin <name>`: the file's own #[test]s
#   wire                 build the binary and talk real JSON-RPC to it over stdio
#   skip_check_unsolved  this exercise passes as-is (only intro1)
#   hint                 what `cargo run -- hint <name>` prints
#   tools                names `tools/list` must include (wire only)
#   calls                `tools/call`s to make and what their replies must say
#
# `done` is what `next` prints once everything passes.

done = """You have an MCP server whose file tools stay inside a root even
   through a symlink, and even for a path that does not exist yet. One hole
   is still open: exec_run runs anything, unguarded. demo04 closes it."""

[[exercises]]
name = "intro1"
dir = "00_intro"
wire = true
skip_check_unsolved = true
tools = ["greet", "fs_read", "fs_write", "exec_run"]
hint = """
Nothing to fix. This one passes so the finished demo03 server is in front of
you before you build its jail: demo02's server with one function rewritten,
`Sandbox::resolve`.

Read `resolve` and notice two things. It canonicalizes before it checks, so
it judges where a path really lands, symlinks followed, instead of how the
path is spelled. And when the path does not exist yet, it does not give up:
it walks up to the nearest ancestor that does, and checks that instead. That
second half is what lets fs_write create a new file.

Then notice what did not change: `run_command` still takes no Sandbox.

Then `cargo run -- next`."""

# The wire probe runs in a scratch directory holding one file (hello.txt), and
# the server takes its working directory as the sandbox root.
[[exercises.calls]]
tool = "greet"
arguments = { name = "Ada" }
expect = [{ at = "/result/structuredContent/greeting", contains = "Ada" }]

[[exercises.calls]]
tool = "fs_read"
arguments = { path = "hello.txt" }
expect = [{ at = "/result/structuredContent/content", contains = "hello" }]

[[exercises.calls]]
tool = "fs_read"
arguments = { path = "../secret.txt" }
expect = [
  { at = "/error/code", equals = -32602 },
  { at = "/error/message", contains = "escapes" },
]

[[exercises.calls]]
tool = "fs_read"
arguments = { path = "/etc/passwd" }
expect = [{ at = "/error/code", equals = -32602 }]

# Neither `deep/` nor `new.txt` exists: resolve has to place the path from the
# root, the fallback half of the jail.
[[exercises.calls]]
tool = "fs_write"
arguments = { path = "deep/new.txt", content = "noted" }
expect = [{ at = "/result/structuredContent/bytes", equals = 5 }]

[[exercises.calls]]
tool = "fs_read"
arguments = { path = "deep/new.txt" }
expect = [{ at = "/result/structuredContent/content", contains = "noted" }]

# A `..` that stays inside the root: demo02 refused it, the jail allows it.
[[exercises.calls]]
tool = "fs_read"
arguments = { path = "deep/../hello.txt" }
expect = [{ at = "/result/structuredContent/content", contains = "hello" }]

# exec_run is exactly as open as in demo01. This call only proves it still runs.
[[exercises.calls]]
tool = "exec_run"
arguments = { cmd = "rustc", args = ["--version"] }
expect = [
  { at = "/result/structuredContent/exit", equals = 0 },
  { at = "/result/structuredContent/stdout", contains = "rustc" },
]

[[exercises]]
name = "jail2"
dir = "02_jail"
test = true
hint = """
Walk up until something exists, then build the path back down:

    let mut existing = joined.as_path();
    let mut missing = Vec::new();
    let canonical_existing = loop {
        if let Ok(canonical) = existing.canonicalize() {
            break canonical;
        }
        if existing.symlink_metadata().is_ok() {
            anyhow::bail!(
                "path {} exists but cannot be resolved (a broken symlink?)",
                existing.display()
            );
        }
        let name = existing
            .file_name()
            .with_context(|| format!("path {} cannot be placed", joined.display()))?;
        missing.push(name);
        existing = existing
            .parent()
            .with_context(|| format!("path {} cannot be placed", joined.display()))?;
    };

    let mut placed = canonical_existing;
    for name in missing.iter().rev() {
        placed.push(name);
    }

then the same `starts_with(&self.root)` check as the half above, on `placed`.

Why the names go back on in reverse: they came off the end first. For
`deep/er/new.txt` the walk collects `new.txt`, then `er`, then `deep`.

Why check `placed` and not `joined`: in `out/new.txt`, `out` is a symlink that
leads outside the root. `joined` still says `root/out/new.txt`. Only the
canonical ancestor says where `out` really goes.

Why running out is a refusal: `file_name()` is `None` when the path ends in
`..`. For `ghost/../../new.txt`, `ghost` does not exist, so nobody can say
where `ghost/..` is. A path that cannot be placed is refused, never let
through.

Why the `symlink_metadata` check: `canonicalize` also fails on a symlink whose
target is missing. That name is not missing. It is a link, and a write to it
creates the file wherever it points. Walking past it would place the write
inside the root while it lands outside.

What this still does not do: a symlink swapped in between `resolve` and the
write wins the race. Checking a path and then using it is two steps, and the
filesystem can change in between."""
