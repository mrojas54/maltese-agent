[package]
name = "demo00"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Women in Rust demo 00: MCP servers in Rust, rustlings-style"
publish = false
# `cargo run` with no `--bin` runs the tutorial runner in src/main.rs.
default-run = "demo00"

# This package is its own tiny workspace, separate from the repo's root one.
# The exercises are broken on purpose, and a broken member would fail every
# `cargo build --workspace` at the root. The root manifest also lists this
# directory under `exclude`; this table is what stops cargo from walking up
# the directory tree to look for a parent at all.
[workspace]

[dependencies]
# The MCP SDK. `server` = we answer requests, `transport-io` = over
# stdin/stdout, `macros` = the #[tool] / #[tool_router] attributes.
# Cargo.lock pins this to the same rmcp version as ../../falcon-mcp so the
# two read alike; rmcp 3.4 renames `ServerInfo` to `ServerConfig`.
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
# Derives the JSON schema the model sees from plain Rust structs.
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
# Logging. Must go to stderr; exercise 04_stdio is about exactly that.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Only the runner uses this: it reads the exercise list and hints from info.toml.
toml = "0.9"

# Every exercise and every solution is its own binary, so `cargo test --bin
# schema1` builds just that one file. That is what lets the other exercises
# stay broken while you work on this one. The runner (`cargo run -- next`)
# drives these for you; you rarely need to type them.

[[bin]]
name = "intro1"
path = "exercises/00_intro/intro1.rs"

[[bin]]
name = "intro1_sol"
path = "solutions/00_intro/intro1.rs"

[[bin]]
name = "schema1"
path = "exercises/01_schema/schema1.rs"

[[bin]]
name = "schema1_sol"
path = "solutions/01_schema/schema1.rs"

[[bin]]
name = "tool1"
path = "exercises/02_tool/tool1.rs"

[[bin]]
name = "tool1_sol"
path = "solutions/02_tool/tool1.rs"

[[bin]]
name = "tool2"
path = "exercises/02_tool/tool2.rs"

[[bin]]
name = "tool2_sol"
path = "solutions/02_tool/tool2.rs"

[[bin]]
name = "handshake1"
path = "exercises/03_handshake/handshake1.rs"

[[bin]]
name = "handshake1_sol"
path = "solutions/03_handshake/handshake1.rs"

[[bin]]
name = "stdio1"
path = "exercises/04_stdio/stdio1.rs"

[[bin]]
name = "stdio1_sol"
path = "solutions/04_stdio/stdio1.rs"
